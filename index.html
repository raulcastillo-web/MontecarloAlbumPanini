<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador Álbum Mundial</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0b6623, #1e90ff);
    color: white;
    text-align: center;
}

.container {
    max-width: 600px;
    margin: 40px auto;
    background: rgba(0,0,0,0.65);
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

h1 {
    margin-bottom: 10px;
}

img {
    width: 110px;
    margin-bottom: 15px;
}

input[type="range"] {
    width: 80%;
}

.valor {
    font-size: 20px;
    margin-bottom: 10px;
}

button {
    padding: 12px;
    width: 80%;
    border-radius: 8px;
    border: none;
    background: #ffcc00;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ffaa00;
}

.progress-bar {
    width: 100%;
    background: #ddd;
    border-radius: 10px;
    margin-top: 20px;
}

.progress {
    width: 0%;
    height: 20px;
    background: #00ff88;
    border-radius: 10px;
    transition: width 0.2s;
}

.resultado {
    margin-top: 25px;
    font-size: 18px;
    line-height: 1.5;
}
</style>

</head>

<body>

<div class="container">

    <img src="https://tiendapanini.com.mx/media/logo/stores/5/panini-logo_2_2_1.png">

    <h1>Simulador costos de llenado Álbum Mundial Panini 2026</h1>

    <p>Porcentaje del álbum que completarás comprando</p>

    <div class="valor" id="valorPorcentaje">90%</div>

    <input type="range" id="porcentaje" min="10" max="100" value="90" oninput="actualizarValor()">

    <br><br>

    <button onclick="iniciarSimulacion()">Calcular</button>

    <div class="progress-bar">
        <div class="progress" id="barra"></div>
    </div>

    <div class="resultado" id="resultado"></div>

</div>

<script>
const N = 980;
const K = 7;
const PRECIO = 25;
const SIMS = 10000;
const MIN_SOBRES = 140;

function actualizarValor() {
    let val = document.getElementById("porcentaje").value;
    document.getElementById("valorPorcentaje").innerText = val + "%";
}

function simularAlbum(porcentajeObjetivo) {
    let objetivo = Math.floor(N * (porcentajeObjetivo / 100));
    let album = new Set();
    let sobres = 0;

    while (album.size < objetivo) {
        for (let i = 0; i < K; i++) {
            let estampa = Math.floor(Math.random() * N) + 1;
            album.add(estampa);
        }
        sobres++;
    }

    return sobres;
}

async function iniciarSimulacion() {
    let porcentaje = parseFloat(document.getElementById("porcentaje").value);

    let resultados = [];
    let barra = document.getElementById("barra");
    let resultadoDiv = document.getElementById("resultado");

    resultadoDiv.innerHTML = "Calculando...";

    for (let i = 0; i < SIMS; i++) {
        resultados.push(simularAlbum(porcentaje));

        if (i % 50 === 0) {
            let progreso = (i / SIMS) * 100;
            barra.style.width = progreso + "%";
            await new Promise(r => setTimeout(r, 0));
        }
    }

    barra.style.width = "100%";

    let promedio = resultados.reduce((a,b)=>a+b,0) / SIMS;

    // Aplicar mínimo de sobres
    let sobresFinal = Math.max(promedio, MIN_SOBRES);

    let costo = sobresFinal * PRECIO;

    resultadoDiv.innerHTML = `
        Necesitas comprar al menos <b>${sobresFinal.toFixed(0)}</b> sobres<br>
        y gastarás aproximadamente <b>$${costo.toFixed(2)} MXN</b><br><br>
        para completar tu álbum Panini del mundial.
    `;
}
</script>

</body>
</html>
