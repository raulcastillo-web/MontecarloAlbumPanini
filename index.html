<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simulador Álbum Panini</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

    <img src="https://tiendapanini.com.mx/media/logo/stores/5/panini-logo_2_2_1.png">

    <h2>Simulador Álbum Panini</h2>

    <!-- MENÚ -->
    <div id="menu">
        <button onclick="mostrarModo('costo')">Calcular costo</button>
        <button onclick="mostrarModo('porcentaje')">Calcular avance</button>
    </div>

    <!-- MODO COSTO -->
    <div id="modoCosto" class="hidden">
        <p>Porcentaje que completarás comprando</p>

        <div id="valorPorcentaje">90%</div>
        <input type="range" id="porcentaje" min="10" max="100" value="90" oninput="actualizarValor()">

        <button onclick="simularCosto()">Calcular</button>
        <button class="secondary" onclick="volverMenu()">Regresar</button>
    </div>

    <!-- MODO PORCENTAJE -->
    <div id="modoPorcentaje" class="hidden">
        <p>¿Cuántos sobres comprarás?</p>

        <div class="input-card">
            <input type="number" id="sobresInput" value="200">
        </div>

        <button onclick="simularPorcentaje()">Calcular</button>
        <button class="secondary" onclick="volverMenu()">Regresar</button>
    </div>

    <div class="progress-bar">
        <div class="progress" id="barra"></div>
    </div>

    <div class="resultado" id="resultado"></div>

</div>

<div class="disclaimer">
Este simulador no es oficial y no está afiliado a Panini.
</div>

<script src="app.js"></script>

</body>
</html>
